name: Publish Wada explorer

on:
  push:
    branches: [main]
    paths:
      - "tools/wada-explorer/**"
      - "scripts/build-wada-explorer.js"
      - "tokens/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Publishing workflow: never cancel a deploy that is running.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned Offentlig release; a bump is these two lines.
  OFFENTLIG_VERSION: "0.7.0"
  OFFENTLIG_SHA256: "0f7821c2b06b230a4466362b03b82e8bf9cf6da188c1b4c83f733b29c2e7499a"

# Build and deploy are separate jobs: a deploy in the same job as the upload
# can ask for the artifact before GitHub has registered it ("No artifacts
# named github-pages"), and re-running such a job adds a second artifact that
# deploy-pages also refuses. Re-run only the failed deploy job.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check the committed explorer is current
        run: node scripts/build-wada-explorer.js --check

      - name: Build site folder
        run: |
          set -euo pipefail
          mkdir -p site/fonts "$RUNNER_TEMP/offentlig"
          cp tools/wada-explorer/index.html site/index.html
          zip="$RUNNER_TEMP/offentlig/OffentligSans-${OFFENTLIG_VERSION}.zip"
          curl -fsSL -o "$zip" "https://github.com/rubenluthman/offentlig/releases/download/v${OFFENTLIG_VERSION}/OffentligSans-${OFFENTLIG_VERSION}.zip"
          echo "${OFFENTLIG_SHA256}  ${zip}" | sha256sum -c -
          unzip -p "$zip" 'OffentligSans/webfonts/OffentligSans[[]wght].woff2' > site/fonts/OffentligSans-wght.woff2
          unzip -p "$zip" 'LICENSE' > site/fonts/LICENSE
          test -s site/fonts/OffentligSans-wght.woff2
          test -s site/fonts/LICENSE

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
