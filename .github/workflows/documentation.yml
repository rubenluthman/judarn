name: Build DocC documentation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Select Xcode Version
        run: |
          XCODE_APP=""
          for v in 26.6 26.5; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then XCODE_APP="/Applications/Xcode_${v}.app"; break; fi
          done
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode 26.6 or 26.5 found on this runner" >&2
            ls /Applications | grep -i xcode >&2 || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Build DocC Documentation
        run: |
          swift package --allow-writing-to-directory ./docs-out \
            generate-documentation --target Judarn \
            --output-path ./docs-out \
            --transform-for-static-hosting \
            --hosting-base-path judarn
