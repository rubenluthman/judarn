<!-- @dsCard group="Components" viewport="700x130" name="Badge & Tag" subtitle="Bold status chips + smaller keyword tags, both as written" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../dist/_ds_bundle.js"></script>
<style> body { margin:0; padding:24px; background:var(--white); --accent:oklch(0.55 0.13 250); --accent-ink:#ffffff; } .row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; } </style>
</head>
<body>
<div id="root"></div>
<script>
  const { Badge, Tag } = window.JudarnDesignSystem;
  const e = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(
    e("div", { className:"row" },
      e(Badge, {}, "Default"),
      e(Badge, { variant:"solid" }, "Aktiv"),
      e(Badge, { variant:"accent" }, "Nyhet"),
      e(Badge, { variant:"accent-outline" }, "Utkast"),
      e(Tag, {}, "Kategori"),
      e(Tag, {}, "Ny"),
      e(Tag, {}, "Arkiv"),
    )
  );
</script>
</body>
</html>
