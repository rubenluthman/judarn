<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../dist/_ds_bundle.js"></script>
<style> body { margin:0; padding:24px; background:var(--white); --accent:oklch(0.45 0.15 12); --accent-ink:#ffffff; }
  .grid{ display:flex; gap:40px; align-items:center; flex-wrap:wrap; } </style>
</head>
<body>
<div id="root"></div>
<script>
  const { LogoLockup } = window.JudarnDesignSystem;
  const e = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(
    e("div", { className:"grid" },
      e(LogoLockup, { name:"JUDARN", tagline:"Standard", variant:"horizontal" }),
      e(LogoLockup, { name:"JUDARN", tagline:"Standard", variant:"vertical" }),
      e(LogoLockup, { variant:"icon" }),
      e(LogoLockup, { name:"JUDARN", tagline:"Reversed", variant:"reversed" }),
    )
  );
</script>
</body>
</html>
